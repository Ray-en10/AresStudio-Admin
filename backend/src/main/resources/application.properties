spring.application.name=ares3dstudio-backend

# Connexion PostgreSQL — remplace par tes identifiants (locaux ou ceux fournis par Supabase/Railway/Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ares3dstudio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session-based API authentication; set a unique bootstrap account before first startup.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# APP_ADMIN_USERNAME and APP_ADMIN_PASSWORD are required to seed the first account.
# Override with exact HTTPS frontend origins in production.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
# Hibernate crée/actualise les tables automatiquement à partir des entités (pratique en dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port du serveur (le frontend Angular tourne sur 4200, donc on garde 8080 ici)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
