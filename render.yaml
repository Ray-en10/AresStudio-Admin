services:
  - type: web
    name: ares3dstudio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: "http://localhost:[*],http://127.0.0.1:[*]"
