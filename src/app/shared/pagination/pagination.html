<nav *ngIf="pageCount > 1" class="pagination" aria-label="Table pages">
  <button type="button" class="page-arrow" aria-label="Previous page" [disabled]="currentPage === 1" (click)="selectPage(currentPage - 1)">‹</button>
  <button *ngIf="firstVisiblePage > 1" type="button" (click)="selectPage(1)">1</button>
  <span *ngIf="firstVisiblePage > 2" class="page-ellipsis" aria-hidden="true">…</span>
  <button
    *ngFor="let page of visiblePages"
    type="button"
    [class.current]="page === currentPage"
    [attr.aria-current]="page === currentPage ? 'page' : null"
    [attr.aria-label]="'Page ' + page"
    (click)="selectPage(page)">
    {{ page }}
  </button>
  <span *ngIf="lastVisiblePage < pageCount - 1" class="page-ellipsis" aria-hidden="true">…</span>
  <button *ngIf="lastVisiblePage < pageCount" type="button" (click)="selectPage(pageCount)">{{ pageCount }}</button>
  <button type="button" class="page-arrow" aria-label="Next page" [disabled]="currentPage === pageCount" (click)="selectPage(currentPage + 1)">›</button>
</nav>
