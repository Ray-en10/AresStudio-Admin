<main class="login-page">
  <section class="brand-panel" aria-label="Ares 3D Studio">
    <img class="brand-logo" src="/Areslog.jpg" alt="Ares 3D Studio" />
    <div class="brand-copy">
      <p class="brand-kicker">STUDIO OPERATIONS</p>
      <h1>Make the work<br />move forward.</h1>
      <p class="brand-caption">Ares 3D Studio workspace</p>
    </div>
    <div class="brand-index" aria-hidden="true"><span>ARES</span><span>3D / STUDIO</span></div>
  </section>

  <section class="login-panel" aria-labelledby="login-heading">
    <div class="login-content">
      <p class="login-eyebrow">SECURE WORKSPACE</p>
      <h2 id="login-heading">Welcome back</h2>
      <p class="login-subtitle">Sign in to continue to your studio.</p>

      <form class="login-form" (ngSubmit)="submit()">
        <label class="login-label" for="username">Username</label>
        <div class="login-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input
            id="username"
            class="login-input"
            name="username"
            [(ngModel)]="user"
            (ngModelChange)="clearError()"
            autocomplete="username"
            placeholder="Your username"
            required
          />
        </div>

        <div class="password-label-row">
          <label class="login-label" for="password">Password</label>
        </div>
        <div class="login-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input
            id="password"
            class="login-input"
            name="password"
            [(ngModel)]="pass"
            (ngModelChange)="clearError()"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Your password"
            required
          />
          <button class="password-toggle" type="button" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3.7-.7"/></svg>
          </button>
        </div>

        <p *ngIf="errorMessage" class="login-error" role="alert">{{ errorMessage }}</p>

        <button class="login-submit" type="submit" [disabled]="submitting || !user.trim() || !pass">
          <span>{{ submitting ? 'Verifying access...' : 'Sign in' }}</span>
          <svg *ngIf="!submitting" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span *ngIf="submitting" class="login-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-security-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>Protected studio access</p>
    </div>
    <p class="login-footer">© Ares 3D Studio</p>
  </section>
</main>
