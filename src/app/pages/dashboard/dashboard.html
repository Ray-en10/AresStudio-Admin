<section class="dashboard-page">
  <div class="stat-grid">
    <article class="stat-card stat-card--purple">
        <div class="stat-card__top">
            <div class="stat-icon">💰</div>
            <button class="range-pill" type="button">Month</button></div>
      <div class="stat-value-row">
        <h3>TND</h3>
        <span class="pulse-icon">↻</span>
      </div>
      <p>Total Earning</p>
    </article>

    <article class="stat-card stat-card--blue">
      <div class="stat-card__top">
        <div class="stat-icon">🧾</div>
        <button class="range-pill" type="button">Month</button>
      </div>
      <div class="stat-value-row">
        <h3></h3>
        <span class="pulse-icon">↗</span>
      </div>
      <p>Orders</p>
    </article>

    <article class="stat-card stat-card--white">
      <div class="stat-card__top">
        <div class="stat-icon"></div>
      </div>
      <div class="stat-value-row">
        <h3>TND</h3>
      </div>
      <p>Income</p>
    </article>
  </div>

  <div class="dashboard-lower">
    <article class="chart-panel">
      <div class="panel-header">
        <h4>Orders Growth</h4>
        <button class="range-pill light" type="button">Month</button>
      </div>

      <div class="chart-figure">
        <div class="chart-grid"></div>
        <div class="chart-bars" aria-label="Growth chart">
          <span class="bar b1"></span>
          <span class="bar b2"></span>
          <span class="bar b3"></span>
          <span class="bar b4"></span>
          <span class="bar b5"></span>
          <span class="bar b6"></span>
          <span class="bar b7"></span>
          <span class="bar b8"></span>
          <span class="bar b9"></span>
        </div>
      </div>

      <div class="chart-summary">
        <span class="amount">TND</span>
      </div>
    </article>

    <aside class="stocks-panel">
      <div class="panel-header">
        <h4>Most In Stock</h4>
      </div>
      <div class="stock-chart stock-chart--purple"></div>
      <div class="stock-item">
        <div class="stock-main">

        </div>
      </div>
    </aside>
  </div>
</section>
